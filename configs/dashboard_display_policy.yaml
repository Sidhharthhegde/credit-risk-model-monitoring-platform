    - {id: SG-04, name: HOUSING_INFORMATION, levels: ["0", "1"]}
    - {id: SG-05, name: CAR_AGE_AVAILABILITY, levels: ["0", "1"]}
    - {id: SG-06, name: EMPLOYMENT_SENTINEL, levels: ["0", "1"]}
    - {id: SG-07, name: BUREAU_REQUEST_AVAILABILITY, levels: ["0", "1"]}
