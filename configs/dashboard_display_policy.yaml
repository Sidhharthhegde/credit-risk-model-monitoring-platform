  evidence_role: REGISTRY_ONLY_NOT_MONITORING_RESULT
  family_count: 12
  level_count: 32
  families:
    - {id: SG-01, name: BUREAU_HISTORY, levels: ["0", "1"]}
    - {id: SG-02, name: PREVIOUS_APPLICATION_HISTORY, levels: ["0", "1"]}
