disclosures:
  simulation: "Simulation scenarios — not calendar periods. Scenario comparisons are not longitudinal trends."
  stable_control: "Stable-control denotes no injected scenario transformation. It does not imply similarity to the TRAIN reference."
  synthetic: "SYNTHETIC SCENARIO EVIDENCE · NON-EMPIRICAL · NOT EXTERNAL VALIDATION"
  fairness: "Descriptive subgroup model-risk evidence. This dashboard does not establish fairness, absence of bias, or regulatory compliance."
  no_history: "No governed comparable longitudinal history is currently available. The infrastructure exists for future comparable runs."
  source_authority: "Technical scoring status and governance authorization are separate dimensions."
  root_cause: "Displayed findings are monitoring signals and do not establish root cause."

governed_unavailable:
  score_bin_distribution: "Phase 12 does not persist Phase 8 score-bin contributions. The dashboard will not read raw files or reconstruct the distribution."
  detailed_segment_results: "Phase 12 persists segment context but not the detailed Phase 10 level-result tables. The dashboard will not bypass the query layer."

