[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-model-monitoring-platform"
version = "1.0.1"
description = "Governance-first monitoring platform for the frozen DF-01 credit-risk model."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Sidharth Ravindra Hegde" }
]
dependencies = [
  "joblib==1.5.3",
  "numpy==2.3.5",
  "pandas==3.0.1",
  "pyarrow==21.0.0",
  "scipy==1.18.0",
  "scikit-learn==1.9.0",
  "xgboost==3.3.0",
  "streamlit==1.61.1",
  "plotly==6.9.0",
  "PyYAML==6.0.3",
  "reportlab==4.4.9",
  "pypdf==6.10.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
